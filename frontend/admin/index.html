<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Dashboard</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div style="max-width:1100px;margin:auto;padding:20px">
    <h1>Admin Dashboard</h1>
    <div id="stats">Loading...</div>
  </div>
<script src="../js/api.js"></script>
<script>
async function load(){
  try{
    const data = await apiRequest('/admin/stats');
    document.getElementById('stats').innerHTML = `<div class="auth-card"><p>Users: ${data.stats.users}</p><p>Packages: ${data.stats.packages}</p></div>`;
  }catch(e){ console.error(e); document.getElementById('stats').innerText='Error or Admin only'; }
}
load();
</script>
</body>
</html>
