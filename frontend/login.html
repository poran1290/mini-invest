<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Login to your account</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <a href="register.html">
            Create an account
        </a>

    </div>

</div>

<script src="js/api.js"></script>

<script>
document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const message =
        document.getElementById("message");

    try {

        const data = await apiRequest(
            "/auth/login",
            {
                method: "POST",
                body: JSON.stringify({
                    email:
                        document.getElementById("email").value,

                    password:
                        document.getElementById("password").value
                })
            }
        );

        localStorage.setItem(
            "token",
            data.token
        );

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        location.href = "dashboard.html";

    } catch(error) {

        message.textContent =
            error.message;
    }

});
</script>

</body>
</html>
