<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div style="max-width:900px;margin:auto;padding:20px">
  <h2>Profile</h2>
  <div id="profile">Loading...</div>
</div>
<script src="js/api.js"></script>
<script>
async function load(){
  try{
    const data = await apiRequest('/users/me');
    document.getElementById('profile').innerHTML = `<div class="auth-card"><h3>${data.user.name}</h3><p>${data.user.email}</p><p>Role: ${data.user.role}</p></div>`;
  }catch(e){ console.error(e); document.getElementById('profile').innerText='Error'; }
}
load();
</script>
</body>
</html>
